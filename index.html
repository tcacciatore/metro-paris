<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Métro de Paris — la chasse aux stations</title>
<link rel="stylesheet" href="style.css?v=99">
</head>
<body>
<canvas id="map"></canvas>

<div id="loader">Chargement du réseau…</div>

<header>
  <h1>Métro de Paris</h1>
  <p id="status">—</p>
  <p id="credit">horaires <a href="https://prim.iledefrance-mobilites.fr/">Île-de-France Mobilités</a> · GTFS</p>
</header>

<p id="record" hidden></p>
<button id="son" title="Son"></button>

<div id="start">
  <div class="rainbow"></div>
  <h2>La chasse aux stations</h2>
  <div id="modes">
    <div class="groupe">
      <span class="etiquette">Tout le réseau</span>
      <div class="segments">
        <button data-mode="metro" class="on">Exploration</button>
        <button data-mode="conquete">Conquête</button>
      </div>
    </div>
    <div class="groupe">
      <span class="etiquette">Sur une ligne</span>
      <div class="segments">
        <button data-mode="ligne">Révision</button>
        <button data-mode="voyage">Voyage</button>
      </div>
    </div>
  </div>
  <div id="lignes" hidden></div>
  <p id="bouts" hidden></p>
  <button id="play"><span class="tri"></span>Jouer</button>
  <button id="album">Collection</button>
</div>

<div id="hud" hidden>
  <div class="quest">
    <div class="pips"></div>
    <span class="step"></span>
    <span class="ask">Trouve <b></b></span>
  </div>
  <div class="clock"><i></i></div>
  <div class="choices" hidden></div>
  <form class="reply" hidden>
    <input type="text" autocomplete="off" spellcheck="false" placeholder="n° d'arrondissement">
    <button type="submit" title="Valider">→</button>
  </form>
  <div class="verdict" hidden></div>
  <div class="tally">
    <span class="score">0</span>
    <span class="streak" hidden></span>
    <button class="quit">abandonner</button>
  </div>
</div>

<div id="album-vue" hidden></div>
<div id="party"></div>
<div id="over" hidden></div>

<div id="rush" hidden>
  <!-- la motrice ferme la marche : la rame file vers la droite, c'est donc son bord
       droit qui ouvre le chemin -->
  <div class="rame">
    <div class="voiture">
      <div class="baies">
        <span class="porte"></span><span class="vitre"></span><span class="vitre"></span>
        <span class="porte"></span><span class="vitre"></span><span class="vitre"></span>
        <span class="porte"></span>
      </div>
      <div class="bogie avant"></div><div class="bogie arriere"></div>
    </div>
    <div class="voiture">
      <div class="baies">
        <span class="porte"></span><span class="vitre"></span><span class="vitre"></span>
        <span class="porte"></span><span class="vitre"></span><span class="vitre"></span>
        <span class="porte"></span>
      </div>
      <div class="bogie avant"></div><div class="bogie arriere"></div>
    </div>
    <div class="voiture tete">
      <div class="baies">
        <span class="porte"></span><span class="vitre"></span><span class="vitre"></span>
        <span class="porte"></span><span class="vitre"></span>
      </div>
      <div class="pare-brise"></div>
      <div class="girouette"></div>
      <div class="phare haut"></div><div class="phare bas"></div>
      <div class="bogie avant"></div><div class="bogie arriere"></div>
    </div>
  </div>
</div>

<div id="fx"></div>
<div id="edge"></div>

<div id="tooltip" hidden></div>


<script src="app.js?v=99"></script>
<script src="cards.js?v=99"></script>
<script src="son.js?v=99"></script>
<script src="game.js?v=99"></script>
<script src="voyage.js?v=99"></script>
<script src="conquete.js?v=99"></script>
</body>
</html>
